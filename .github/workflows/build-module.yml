name: Build Game Space Unleashed

on:
  push:
    branches:
      - main
      - 'claude/*'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download apktool
        run: |
          curl -L -o apktool.jar "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar"

      - name: Download APKs from release
        run: |
          # Download original APKs from the apk-dump release
          gh release download apk-dump -p "rm10.zip" || true
          if [ -f rm10.zip ]; then
            unzip rm10.zip
          else
            echo "ERROR: Could not download APK dump. Upload GameAssist.apk and GameSpace.apk to the 'apk-dump' release."
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Decompile APKs (DEX only — no resource recompilation)
        run: |
          # --no-res: only decompile DEX (smali), skip resources
          # This avoids needing device framework and preserves resources perfectly
          java -jar apktool.jar d --no-res GameAssist.apk -o GameAssist_decompiled -f
          java -jar apktool.jar d --no-res GameSpace.apk -o GameSpace_decompiled -f

      - name: Apply patches
        run: |
          python3 patches/apply_patches.py GameAssist_decompiled GameSpace_decompiled

      - name: Recompile patched DEX and inject into original APKs
        run: |
          # Recompile smali → DEX only
          java -jar apktool.jar b GameAssist_decompiled -o GameAssist_recompiled.apk
          java -jar apktool.jar b GameSpace_decompiled -o GameSpace_recompiled.apk

          # Copy original APKs (preserves resources, native libs, manifest, META-INF)
          cp GameAssist.apk GameAssist_patched.apk
          cp GameSpace.apk GameSpace_patched.apk

          # Extract patched DEX files from recompiled APK
          mkdir -p dex_ga dex_gs
          cd dex_ga && unzip -o ../GameAssist_recompiled.apk 'classes*.dex' && cd ..
          cd dex_gs && unzip -o ../GameSpace_recompiled.apk 'classes*.dex' && cd ..

          echo "=== Patched DEX files (GameAssist) ==="
          ls -la dex_ga/

          echo "=== Patched DEX files (GameSpace) ==="
          ls -la dex_gs/

          # Replace DEX files in original APKs (keeps everything else intact)
          cd dex_ga && zip -u ../GameAssist_patched.apk classes*.dex && cd ..
          cd dex_gs && zip -u ../GameSpace_patched.apk classes*.dex && cd ..

          # Remove V2/V3 APK signing block from the ZIP.
          # We keep META-INF/* (V1 cert) so PackageManager still sees the
          # original Nubia/ZTE certificate identity. The V1 digests will be
          # wrong for changed DEX entries, but system partition apps on
          # Magisk-mounted paths can tolerate this — what matters is the
          # certificate identity matching packages.xml.
          # The V2/V3 block is a binary blob BEFORE the ZIP central directory;
          # we strip it with a small python script:
          python3 - GameAssist_patched.apk GameSpace_patched.apk << 'PYEOF'
          import sys, struct

          def strip_apk_v2_block(path):
              """Remove APK Signing Block (v2/v3) from an APK.
              The block sits between the last local file entry and the
              central directory, identified by magic 'APK Sig Block 42'."""
              with open(path, 'rb') as f:
                  data = f.read()

              # Find End of Central Directory
              eocd_offset = data.rfind(b'\x50\x4b\x05\x06')
              if eocd_offset < 0:
                  print(f"  {path}: no EOCD found, skipping")
                  return

              # CD offset is at EOCD+16
              cd_offset = struct.unpack_from('<I', data, eocd_offset + 16)[0]

              # Check for APK Signing Block magic right before CD
              # The block ends with: 8-byte size + 16-byte magic "APK Sig Block 42"
              magic = b'APK Sig Block 42'
              magic_offset = cd_offset - 16
              if magic_offset < 8 or data[magic_offset:magic_offset+16] != magic:
                  print(f"  {path}: no v2/v3 signing block found")
                  return

              # Read block size (8 bytes before magic)
              block_size = struct.unpack_from('<Q', data, magic_offset - 8)[0]
              block_start = cd_offset - block_size - 8

              print(f"  {path}: stripping v2/v3 block ({block_size} bytes at offset {block_start})")

              # Remove the block
              new_data = data[:block_start] + data[cd_offset:]

              # Fix CD offset in EOCD
              new_cd_offset = block_start
              new_eocd_offset = eocd_offset - (cd_offset - block_start)
              struct.pack_into('<I', bytearray(new_data) if isinstance(new_data, bytes) else new_data, 0, 0)

              # Rebuild properly
              new_data = bytearray(data[:block_start] + data[cd_offset:])
              shift = cd_offset - block_start
              new_eocd_offset = eocd_offset - shift
              struct.pack_into('<I', new_data, new_eocd_offset + 16, new_cd_offset)

              with open(path, 'wb') as f:
                  f.write(new_data)
              print(f"  {path}: v2/v3 block removed, CD offset fixed")

          for apk in sys.argv[1:]:
              strip_apk_v2_block(apk)
          PYEOF

          echo "✅ DEX injection complete, v2/v3 signing blocks stripped"

      - name: Package Magisk module
        run: |
          VERSION=$(grep 'version=' module/module.prop | cut -d'=' -f2)

          mkdir -p build/module/system/app/GameAssist
          mkdir -p build/module/system/priv-app/GameSpace
          mkdir -p build/module/META-INF/com/google/android

          # Copy module files
          cp module/module.prop build/module/
          cp module/customize.sh build/module/
          cp module/service.sh build/module/
          cp module/uninstall.sh build/module/
          cp module/META-INF/com/google/android/update-binary build/module/META-INF/com/google/android/
          cp module/META-INF/com/google/android/updater-script build/module/META-INF/com/google/android/

          # Copy patched APKs (with original cert, v2/v3 block stripped)
          cp GameAssist_patched.apk build/module/system/app/GameAssist/GameAssist.apk
          cp GameSpace_patched.apk build/module/system/priv-app/GameSpace/GameSpace.apk

          # Create .replace markers for OAT directories
          # This tells Magisk to mount empty dirs over the original pre-compiled
          # code, forcing Android to load from our patched DEX instead of cached OAT
          mkdir -p build/module/system/app/GameAssist/oat
          touch build/module/system/app/GameAssist/oat/.replace
          mkdir -p build/module/system/priv-app/GameSpace/oat
          touch build/module/system/priv-app/GameSpace/oat/.replace

          # Create flashable zip
          cd build/module
          zip -r "../../GameSpaceUnleashed-${VERSION}.zip" .

          cd ../..
          echo "=== Module contents ==="
          unzip -l "GameSpaceUnleashed-${VERSION}.zip"

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'version=' module/module.prop | cut -d'=' -f2)
          VERSIONCODE=$(grep 'versionCode=' module/module.prop | cut -d'=' -f2)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "versionCode=${VERSIONCODE}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameSpaceUnleashed-${{ steps.version.outputs.version }}
          path: GameSpaceUnleashed-*.zip

      - name: Create/Update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Game Space Unleashed ${{ steps.version.outputs.version }}
          make_latest: true
          files: GameSpaceUnleashed-*.zip
          body: |
            ## Game Space Unleashed ${{ steps.version.outputs.version }} by MsysteM

            Magisk module to unlock **ALL** Game Space features for **ALL** games on RedMagic devices.
            No LSPosed required — pure APK overlay.

            ### What's New in v2.0.2
            - 🔧 Fix: clear OAT/VDEX cache so Android loads patched DEX (not cached old code)
            - 🔧 Fix: `.replace` markers for oat/ dirs — forces DEX recompilation
            - 🔧 Fix: preserve original certificate identity (strip v2/v3 block only)
            - 🔧 Fix: clear PackageManager cache on install

            ### Unlocked Features
            - ⚡ Super Resolution / Superior Pic Quality for ALL games
            - 🎮 Frame Rate Boost / Frame Interpolation for ALL games
            - 🎯 Crosshair, Hunt Mode, Sight Assist for ALL games
            - 🤖 AI Trigger, Sound Equalizer, 4D Vibrate for ALL games
            - 📊 Game Prediction, Combat Power, Voice Controller
            - ⚙️ 55 ZTE feature flags force-enabled
            - 🎯 Aim helper unlocked for ALL games
            - 🏎️ Touch precision for ALL games

            ### Requirements
            - RedMagic device with Game Space
            - Magisk v20.4+
            - GameAssist v16.5 / GameSpace v16.0

            ### Installation
            1. Download `GameSpaceUnleashed-${{ steps.version.outputs.version }}.zip` below
            2. Magisk → Modules → Install from storage
            3. Reboot
            4. Open any game → ALL features available!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update auto-updater JSON
        run: |
          VERSION=${{ steps.version.outputs.version }}
          VERSIONCODE=${{ steps.version.outputs.versionCode }}
          cat > update.json << UPDATEEOF
          {
            "version": "${VERSION}",
            "versionCode": ${VERSIONCODE},
            "zipUrl": "https://github.com/JueN-Sar/GameSpaceUnleashed/releases/download/${VERSION}/GameSpaceUnleashed-${VERSION}.zip",
            "changelog": "https://github.com/JueN-Sar/GameSpaceUnleashed/releases/tag/${VERSION}"
          }
          UPDATEEOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet || git commit -m "chore: update auto-updater to ${VERSION}" && git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
