name: Build Game Space Unleashed

on:
  push:
    branches:
      - main
      - 'release/*'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "build-tools;35.0.0" "platforms;android-35" "ndk;27.0.12077973"

      - name: Clone Dobby (inline hooking)
        run: |
          # Use LSPosed's maintained fork of Dobby (same version used by LSPosed with LSPlant)
          git clone --depth=1 https://github.com/LSPosed/Dobby.git external/dobby

      - name: Clone LSPlant
        run: |
          git clone --depth=1 --branch v6.4 https://github.com/LSPosed/LSPlant.git external/lsplant
          cd external/lsplant
          git submodule update --init --recursive --depth=1 lsplant/src/main/jni/external/dex_builder

      - name: Build native module (arm64-v8a)
        run: |
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973
          cd native
          mkdir -p build
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          cmake --build build -j$(nproc)

      - name: Compile Java hooks to DEX
        run: |
          ANDROID_JAR=$ANDROID_SDK_ROOT/platforms/android-35/android.jar
          BUILD_TOOLS=$ANDROID_SDK_ROOT/build-tools/35.0.0

          # Compile Java
          mkdir -p build/java
          find java -name "*.java" > build/sources.txt
          javac -source 11 -target 11 \
            -cp "$ANDROID_JAR" \
            -d build/java \
            @build/sources.txt

          # Convert to DEX
          mkdir -p build/dex
          $BUILD_TOOLS/d8 \
            --min-api 26 \
            --output build/dex \
            $(find build/java -name "*.class")

      - name: Package Magisk module
        run: |
          mkdir -p build/module/zygisk
          mkdir -p build/module/webroot
          mkdir -p build/module/dex
          mkdir -p build/module/META-INF/com/google/android

          # Copy module files
          cp module/module.prop build/module/
          cp module/customize.sh build/module/
          cp module/service.sh build/module/
          cp module/post-fs-data.sh build/module/
          cp module/uninstall.sh build/module/
          cp module/config.json build/module/
          cp -r module/webroot/* build/module/webroot/
          cp module/META-INF/com/google/android/update-binary build/module/META-INF/com/google/android/
          cp module/META-INF/com/google/android/updater-script build/module/META-INF/com/google/android/

          # Copy native library (rename to arm64-v8a.so for Zygisk)
          cp native/build/lib/arm64-v8a/libgame_space_unleashed.so build/module/zygisk/arm64-v8a.so

          # Copy DEX
          cp build/dex/classes.dex build/module/dex/

          # Create flashable zip
          cd build/module
          VERSION=$(grep 'version=' module.prop | cut -d'=' -f2)
          zip -r "../../GameSpaceUnleashed-${VERSION}.zip" .

          # Verify zip contents
          echo "=== Zip contents ==="
          cd ../..
          unzip -l "GameSpaceUnleashed-${VERSION}.zip"

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'version=' module/module.prop | cut -d'=' -f2)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameSpaceUnleashed-${{ steps.version.outputs.version }}
          path: GameSpaceUnleashed-*.zip

      - name: Create/Update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Game Space Unleashed ${{ steps.version.outputs.version }}
          make_latest: true
          files: GameSpaceUnleashed-*.zip
          body: |
            ## Game Space Unleashed by MsysteM

            Magisk module to unlock Super Resolution and Game Space features for all games on RedMagic devices.
            No LSPosed required - powered by Zygisk + LSPlant.

            ### Features
            - ⚡ Super Resolution / Superior Pic Quality for ALL games
            - 🎮 Global Game Mode - treat any app as a game
            - 🛡️ No Kill - prevent background app cleanup
            - 🔲 Hide Energy Cube overlay
            - 📐 Small Window for all apps
            - ✍️ Extended watermark text length

            ### Requirements
            - Magisk with Zygisk or ReZygisk
            - RedMagic device with Game Space
            - KsuWebUI for settings interface

            ### Installation
            1. Download `GameSpaceUnleashed-${{ steps.version.outputs.version }}.zip` below
            2. Open Magisk → Modules → Install from storage
            3. Select the zip and flash
            4. Reboot
            5. Open KsuWebUI → Game Space Unleashed
            6. Toggle features and tap "Apply & Restart Games"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
