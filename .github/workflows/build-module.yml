name: Build Game Space Unleashed

on:
  push:
    branches:
      - main
      - 'claude/*'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Magisk module
        run: |
          VERSION=$(grep 'version=' module/module.prop | cut -d'=' -f2)

          mkdir -p build/module/META-INF/com/google/android

          # Copy module files (NO APKs — property-only approach)
          cp module/module.prop build/module/
          cp module/customize.sh build/module/
          cp module/service.sh build/module/
          cp module/uninstall.sh build/module/
          cp module/META-INF/com/google/android/update-binary build/module/META-INF/com/google/android/
          cp module/META-INF/com/google/android/updater-script build/module/META-INF/com/google/android/

          # Create flashable zip
          cd build/module
          zip -r "../../GameSpaceUnleashed-${VERSION}.zip" .

          cd ../..
          echo "=== Module contents ==="
          unzip -l "GameSpaceUnleashed-${VERSION}.zip"
          echo ""
          echo "Module size: $(du -h GameSpaceUnleashed-${VERSION}.zip | cut -f1)"

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'version=' module/module.prop | cut -d'=' -f2)
          VERSIONCODE=$(grep 'versionCode=' module/module.prop | cut -d'=' -f2)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "versionCode=${VERSIONCODE}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameSpaceUnleashed-${{ steps.version.outputs.version }}
          path: GameSpaceUnleashed-*.zip

      - name: Create/Update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Game Space Unleashed ${{ steps.version.outputs.version }}
          make_latest: true
          files: GameSpaceUnleashed-*.zip
          body: |
            ## Game Space Unleashed ${{ steps.version.outputs.version }} by MsysteM

            Magisk module to unlock **ALL** Game Space features on RedMagic devices.
            No LSPosed required — no APK replacement — pure system property approach.

            ### What's New in v2.1.0
            - 🔧 **Complete rewrite**: property-only approach, NO APK replacement
            - ✅ Original GameAssist & GameSpace APKs stay untouched
            - ✅ All signature-level permissions preserved (overlay, system windows)
            - ✅ 100+ ZTE feature properties set to true
            - ✅ All 70+ plugins enabled via Settings.Global
            - ✅ R3 chip GFRC properties enabled
            - ✅ GFRC mode pre-configured for popular games
            - 📦 Tiny module size (~5KB vs 280MB)

            ### How It Works
            Unlike v2.0.x which replaced system APKs (breaking overlay permissions),
            v2.1.0 sets the system properties and Settings.Global values that
            GameAssist and GameSpace READ to determine feature availability.
            Original APKs stay intact with their platform signature.

            ### Unlocked Features
            - ⚡ Super Resolution / Superior Pic Quality
            - 🎮 Frame Rate Boost / Frame Interpolation (R3 chip)
            - 🎯 Crosshair, Hunt Mode, Sight Assist, AI Trigger
            - 🤖 Sound Equalizer, 4D Vibrate, Voice Controller
            - 📊 Game Prediction, Combat Power, AI Tips
            - ⚙️ 100+ ZTE feature flags force-enabled
            - 🎯 All 70+ sidebar plugins enabled

            ### Requirements
            - RedMagic device with Game Space
            - Magisk v20.4+

            ### Installation
            1. **Remove v2.0.x first** if installed (Magisk → Modules → Remove)
            2. Download `GameSpaceUnleashed-${{ steps.version.outputs.version }}.zip`
            3. Magisk → Modules → Install from storage
            4. Reboot
            5. Open any game → features should be available!

            ### Upgrade from v2.0.x
            If v2.0.x broke your Game Space, removing it and rebooting will
            restore the original apps. Then install v2.1.0.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update auto-updater JSON
        run: |
          VERSION=${{ steps.version.outputs.version }}
          VERSIONCODE=${{ steps.version.outputs.versionCode }}
          cat > update.json << UPDATEEOF
          {
            "version": "${VERSION}",
            "versionCode": ${VERSIONCODE},
            "zipUrl": "https://github.com/JueN-Sar/GameSpaceUnleashed/releases/download/${VERSION}/GameSpaceUnleashed-${VERSION}.zip",
            "changelog": "https://github.com/JueN-Sar/GameSpaceUnleashed/releases/tag/${VERSION}"
          }
          UPDATEEOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet || git commit -m "chore: update auto-updater to ${VERSION}" && git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
