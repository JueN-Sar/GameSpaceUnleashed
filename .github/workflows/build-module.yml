name: Build Game Space Unleashed

on:
  push:
    branches:
      - main
      - 'claude/nubia-toolkit-*'
    paths-ignore:
      - '**.md'
      - 'research/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Magisk module
        run: |
          mkdir -p build/module

          # Copy module files
          cp module/module.prop build/module/
          cp module/customize.sh build/module/
          cp module/service.sh build/module/
          cp module/post-fs-data.sh build/module/
          cp module/uninstall.sh build/module/
          cp module/system.prop build/module/

          # Create flashable zip
          cd build/module
          VERSION=$(grep 'version=' module.prop | cut -d'=' -f2)
          zip -r "../../GameSpaceUnleashed-${VERSION}.zip" .

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'version=' module/module.prop | cut -d'=' -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameSpaceUnleashed
          path: GameSpaceUnleashed-*.zip

      - name: Create release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Game Space Unleashed ${{ steps.version.outputs.version }}
          files: GameSpaceUnleashed-*.zip
          make_latest: true
          body: |
            ## Game Space Unleashed ${{ steps.version.outputs.version }}

            Bug fixes and stability improvements.

            ### Installation
            1. Flash the zip in Magisk / KernelSU
            2. Reboot
            3. Enjoy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
